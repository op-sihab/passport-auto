<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FC2FF"/>
      <stop offset="55%" stop-color="#4A9FF5"/>
      <stop offset="100%" stop-color="#2563C9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF3FF"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9FF5"/>
      <stop offset="100%" stop-color="#1E4FA8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B3A7A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="110" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- photo card 4:5 -->
  <rect x="146" y="102" width="220" height="275" rx="22" fill="url(#card)" filter="url(#sh)"/>

  <!-- portrait silhouette -->
  <circle cx="256" cy="196" r="47" fill="url(#fig)"/>
  <path d="M180 377 C180 315 212 281 256 281 C300 281 332 315 332 377 Z" fill="url(#fig)"/>

  <!-- crop brackets -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M96 148 L96 106 Q96 92 110 92 L152 92"/>
    <path d="M416 364 L416 406 Q416 420 402 420 L360 420"/>
  </g>
</svg>
